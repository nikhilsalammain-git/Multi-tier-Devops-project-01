name: CI Pipeline

on:
  push:
    branches:
      - main


permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build, tag & push image to Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/flask-app:latest flask-app/
          docker push ${{ secrets.DOCKER_USER }}/flask-app:latest
    
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh -o install.sh
          chmod +x install.sh
          sudo ./install.sh -b /usr/local/bin v0.74.0
 
      - name: Scan Docker image for vulnerabilities
        run: |
          trivy image ${{ secrets.DOCKER_USER }}/flask-app:latest
      
      - name: Scan terraform & helm files for security issues using Trivy
        run: |
          trivy fs --exit-code 1 --severity HIGH,CRITICAL flask-CRUD-infra/terraform
          trivy fs --exit-code 1 --severity HIGH,CRITICAL flask-CRUD-infra/helm

      - name: Trivy artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report # Name of the downloaded zip folder
          path: trivy-report.txt # Path to the file created in the previous step
          retention-days: 5 # Optional: Cleans up the file automatically after 5 days