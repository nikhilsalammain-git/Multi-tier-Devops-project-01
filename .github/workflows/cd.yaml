name: CICD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TERRAFORM_DIR: flask-CRUD-infra/terraform
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  terraform-apply:
    name: Apply Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false
      
      - name: RDS password
        run: export TF_VAR_rds_password=${{ secrets.RDS_PASSWORD }}

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform validate

      - name: Terraform apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -input=false -auto-approve

      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Login to docker
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}        

      - name: Build, tag & push image to docker hub
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/flask-img:latest flask-app/
          docker push ${{ secrets.DOCKER_USER }}/flask-img:latest
      - name: Get RDS endpoint from Terraform
        id: rds
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform init -input=false
          ENDPOINT=$(terraform output -raw endpoint)
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "db_name=$(terraform output -raw db_name)" >> "$GITHUB_OUTPUT"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure EKS kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region us-east-1

      - name: Create Kubernetes namespace
        run: |
          kubectl create namespace flask-app \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Kubernetes database secret
        run: |
          kubectl create secret generic flask-db-secret \
            --from-literal=DB_URL="postgresql://${{ vars.RDS_USERNAME }}:${{ secrets.RDS_PASSWORD }}@${{ steps.rds.outputs.endpoint }}:5432/${{ steps.rds.outputs.db_name }}" \
            --namespace=flask-app \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Kubernetes resources
        run: kubectl apply -k flask-CRUD-infra/k8s
          


