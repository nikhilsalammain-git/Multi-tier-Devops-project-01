name: CICD Pipeline

on:
  push:
    branches:
      - main


permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TERRAFORM_DIR: flask-CRUD-infra/terraform
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  

jobs:
  FULL_DEPLOYMENT:
    name: Continuous Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform validate

      - name: Terraform apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -input=false -auto-approve

      - name: Get RDS connection info from Terraform
        id: rds
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          echo "endpoint=$(terraform output -raw rds_endpoint)" >> "$GITHUB_OUTPUT"
          echo "db_name=$(terraform output -raw rds_db_name)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build, tag & push image to Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/flask-app:latest flask-app/
          docker push ${{ secrets.DOCKER_USER }}/flask-app:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure EKS kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region us-east-1

      - name: Create Kubernetes namespace
        run: |
          kubectl create namespace flask-app \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Kubernetes database secret
        run: |
          kubectl create secret generic flask-db-secret \
            --from-literal=DB_URL="postgresql://flaskadmin:{{ secrets.DB_PASSWORD }}@${{ steps.rds.outputs.endpoint }}:5432/${{ steps.rds.outputs.db_name }}" \
            --namespace=flask-app \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "DB_URL=postgresql://flaskadmin:{{ secrets.DB_PASSWORD }}@${{ steps.rds.outputs.endpoint }}:5432/${{ steps.rds.outputs.db_name }}" 

      - name: Set image and deploy flask app
        run: |
          helm upgrade --install flask-app ./flask-CRUD-infra/helm/flask-app \
            --namespace flask-app \
            --set env.DB_URL=postgresql://flaskadmin:{{ secrets.DB_PASSWORD }}@${{ steps.rds.outputs.endpoint }}:5432/${{ steps.rds.outputs.db_name }}
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/flask-app -n flask-app
      
      - name: Deploy prometheus and grafana
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace
          helm upgrade prometheus-stack prometheus-community/kube-prometheus-stack   -n monitoring   -f monitoring-values.yaml

          kubectl apply -f flask-CRUD-infra/helm/service-monitor.yaml -n monitoring
          

