apiVersion: v1
kind: Service
metadata:
  name: {{ include "flask-app.fullname" . }}
  labels:
    {{- include "flask-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 4000
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: 9090
      protocol: TCP
  selector:
    {{- include "flask-app.selectorLabels" . | nindent 4 }}
